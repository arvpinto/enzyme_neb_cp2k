topic_color: "#ff5257"
series: Part 2 of Enzyme QM/MM with CP2K
tools: [CP2K, parmed]
hero:
  src: /assets/img/US_TUTORIAL-1000.webp
  src_small: /assets/img/US_TUTORIAL-600.webp
  small_width: 600
  width: 1000
  height: 529
  alt: Protein helices in rainbow colours around a bound lipid substrate shown as spheres
