title: Tutorial for Transition State (TS) searches of Enzymatic Reaction Mechanisms using QM/MM methods in CP2K
description: Locate the reactant, transition state and product of an enzymatic reaction with QM/MM geometry optimizations, a potential energy surface scan, the CI-NEB method, vibrational analysis and the dimer method in CP2K.
author: Alexandre V. Pinto
lang: en
image: /assets/img/US_TUTORIAL.png

